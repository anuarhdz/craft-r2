name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer audit
      - name: Verify release archive
        run: |
          mkdir -p dist
          git archive HEAD --output=dist/plugin.tar
          tar -tf dist/plugin.tar
          test "$(tar -tf dist/plugin.tar | grep -Ec '^(src/|composer.json$|README.md$|CHANGELOG.md$|LICENSE.txt$)')" -eq "$(tar -tf dist/plugin.tar | wc -l)"

  install:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: craft_r2_test
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none
      - name: Verify Craft installation and plugin lifecycle
        env:
          CRAFT_R2_TEST_DB_SERVER: 127.0.0.1
        run: bash tests/setup-integration.sh
